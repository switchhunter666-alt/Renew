name: Verify packaged Windows candidate
on:
  pull_request:
    paths:
      - '.github/workflows/packaged-preview.yml'
      - 'tests/native/packaged-release.test.cjs'
      - 'tests/native/packaged-ui.cjs'
      - 'tests/native/windows-probe.ps1'
      - 'tests/native/fixtures/renew-smoke-rom.cjs'
      - 'docs/PACKAGED_PREVIEW_TEST.md'
      - 'desktop/**'
      - 'src/**'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: packaged-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate-windows:
    name: Candidate portable UI and authored-ROM verification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The repository Electron binary is used only to build the candidate.
      # Test execution spawns the resulting outer portable, with no source fallback.
      - run: npm ci
      - name: Build exact-source unsigned candidate
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:win -- --publish never
      - name: Bind candidate executable and packaged resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executables = @(Get-ChildItem -LiteralPath 'dist' -File -Filter '*.exe')
          if ($executables.Count -ne 1) { throw 'Expected exactly one candidate portable EXE.' }
          $asar = Join-Path (Get-Location) 'dist/win-unpacked/resources/app.asar'
          $exeDigest = (Get-FileHash -Algorithm SHA256 $executables[0].FullName).Hash.ToLowerInvariant()
          $asarDigest = (Get-FileHash -Algorithm SHA256 $asar).Hash.ToLowerInvariant()
          "RENEW_RELEASE_EXE=$($executables[0].FullName)" >> $env:GITHUB_ENV
          "RENEW_PACKAGE_KIND=candidate" >> $env:GITHUB_ENV
          "RENEW_EXPECTED_EXE_SHA256=$exeDigest" >> $env:GITHUB_ENV
          "RENEW_EXPECTED_ASAR_SHA256=$asarDigest" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path 'artifacts/packaged' -Force | Out-Null
          @{kind='candidate'; sourceCommit=$env:GITHUB_SHA; prHead='${{ github.event.pull_request.head.sha }}'; exeSha256=$exeDigest; asarSha256=$asarDigest; exeBytes=$executables[0].Length; originalReleaseUnchanged=$true} | ConvertTo-Json | Set-Content 'artifacts/packaged/build-receipt.json'
      - name: Prepare official mGBA 0.10.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'renew-packaged-mgba-official-0.10.5'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive = Join-Path $root 'mGBA-0.10.5-win64.7z'
          Invoke-WebRequest -Uri 'https://github.com/mgba-emu/mgba/releases/download/0.10.5/mGBA-0.10.5-win64.7z' -OutFile $archive
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($digest -ne 'b497a57c7d9093834dadc64f33a90f7c411439c21fdb8a0143255a45ea37563a') { throw 'Pinned official mGBA archive hash mismatch.' }
          $extracted = Join-Path $root 'extracted'
          & 7z x $archive "-o$extracted" -y
          if ($LASTEXITCODE -ne 0) { throw 'Official mGBA extraction failed.' }
          $executables = @(Get-ChildItem -LiteralPath $extracted -Recurse -File -Filter mGBA.exe)
          if ($executables.Count -ne 1) { throw 'Expected exactly one official mGBA.exe.' }
          "RENEW_MGBA_EXE=$($executables[0].FullName)" >> $env:GITHUB_ENV
          "RENEW_MGBA_ARCHIVE_SHA256=$digest" >> $env:GITHUB_ENV
      - name: Test the actual candidate Windows portable
        timeout-minutes: 7
        run: node --test tests/native/packaged-release.test.cjs
      - name: Require explicit complete runtime evidence
        shell: pwsh
        run: |
          $receipt = Get-Content -Raw 'artifacts/packaged/result.json' | ConvertFrom-Json
          if ($receipt.status -ne 'PASS' -or $receipt.platform -ne 'win32' -or $receipt.target.kind -ne 'candidate' -or $receipt.target.sourceCommit -ne $env:GITHUB_SHA -or $receipt.phase -ne 'cleanup:finished' -or $receipt.forcedCleanup -or $receipt.cleanupError -or $receipt.closeError) { throw "Packaged verification is incomplete, stale or failed: $($receipt.status) $($receipt.reason)" }
          foreach ($name in @('emptyPackagedStartup','homeSelection','searchFiltersKeyboardSelection','renameFavoritesSortViewsSidebar','settingsActualIPCAndDismissal','powerEnableReloadDeviceInfo','enabledPowerAndSidebarPortableRestart','paletteNavigationPickAndEscape','powerMasterDisableAndResetIsolation','removalCancelConfirmPreservesFile','restartPersistence','realSessionRunning','romIdentity','fullscreenForeground','frameProgress','fullscreenForegroundFrames','cleanExitReturnAndPersistence')) {
            if ($receipt.checks.$name -ne $true) { throw "Packaged check missing: $name" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renew-windows-candidate-evidence
          path: artifacts/packaged/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: renew-windows-candidate-unsigned-${{ github.sha }}
          path: dist/*.exe
          retention-days: 14

name: Verify Renew
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit and DOM · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
  browser:
    name: Chromium UI and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renew-ui-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  package:
    name: Windows desktop smoke and portable package
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - name: Prepare official mGBA 0.10.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'renew-mgba-official-0.10.5'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive = Join-Path $root 'mGBA-0.10.5-win64.7z'
          $url = 'https://github.com/mgba-emu/mgba/releases/download/0.10.5/mGBA-0.10.5-win64.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $extracted = Join-Path $root 'extracted'
          & 7z x $archive "-o$extracted" -y
          if ($LASTEXITCODE -ne 0) { throw 'Official mGBA extraction failed.' }
          $executables = @(Get-ChildItem -LiteralPath $extracted -Recurse -File -Filter mGBA.exe)
          if ($executables.Count -ne 1) { throw 'Expected exactly one official mGBA.exe.' }
          "RENEW_MGBA_EXE=$($executables[0].FullName)" >> $env:GITHUB_ENV
          "RENEW_MGBA_ARCHIVE_SHA256=$digest" >> $env:GITHUB_ENV
      - name: Real mGBA integration and foreground evidence
        timeout-minutes: 4
        run: node --test tests/native/mgba-integration.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renew-windows-smoke
          path: artifacts/native/
          retention-days: 14
      - run: npm run package:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: renew-windows-portable-unsigned
          path: dist/*.exe
          retention-days: 14
